<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2d3436"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg3)"/>
  <!-- Ambient glow -->
  <circle cx="300" cy="200" r="150" fill="#c9a96e" opacity="0.04"/>
  <circle cx="300" cy="200" r="100" fill="#c9a96e" opacity="0.03"/>
  <!-- Plate -->
  <circle cx="300" cy="200" r="120" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.2"/>
  <circle cx="300" cy="200" r="100" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.15"/>
  <circle cx="300" cy="200" r="80" fill="#2d3436" stroke="#c9a96e" stroke-width="0.5" opacity="0.4"/>
  <!-- Food elements on plate -->
  <ellipse cx="280" cy="190" rx="25" ry="12" fill="#c9a96e" opacity="0.3" transform="rotate(-15 280 190)"/>
  <ellipse cx="310" cy="195" rx="20" ry="8" fill="#e17055" opacity="0.25"/>
  <circle cx="295" cy="210" r="6" fill="#00b894" opacity="0.3"/>
  <circle cx="310" cy="205" r="4" fill="#fdcb6e" opacity="0.25"/>
  <circle cx="285" cy="200" r="3" fill="#fd79a8" opacity="0.2"/>
  <!-- Steam lines -->
  <g opacity="0.15" stroke="#c9a96e" stroke-width="1.5" fill="none">
    <path d="M280 160 Q275 145 280 130 Q285 115 280 100">
      <animate attributeName="d" values="M280 160 Q275 145 280 130 Q285 115 280 100;M280 160 Q285 145 280 130 Q275 115 280 100;M280 160 Q275 145 280 130 Q285 115 280 100" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M300 155 Q295 138 300 120 Q305 102 300 85">
      <animate attributeName="d" values="M300 155 Q295 138 300 120 Q305 102 300 85;M300 155 Q305 138 300 120 Q295 102 300 85;M300 155 Q295 138 300 120 Q305 102 300 85" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M320 158 Q315 140 320 122 Q325 104 320 86">
      <animate attributeName="d" values="M320 158 Q315 140 320 122 Q325 104 320 86;M320 158 Q325 140 320 122 Q315 104 320 86;M320 158 Q315 140 320 122 Q325 104 320 86" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Fork and knife -->
  <g transform="translate(150, 180) rotate(-10)" opacity="0.15">
    <rect x="0" y="0" width="3" height="80" rx="1.5" fill="#c9a96e"/>
    <rect x="-2" y="0" width="2" height="20" rx="1" fill="#c9a96e"/>
    <rect x="2" y="0" width="2" height="20" rx="1" fill="#c9a96e"/>
  </g>
  <g transform="translate(440, 180) rotate(10)" opacity="0.15">
    <rect x="0" y="0" width="3" height="80" rx="1.5" fill="#c9a96e"/>
    <path d="M0 0 Q6 10 0 25" fill="none" stroke="#c9a96e" stroke-width="2"/>
  </g>
  <!-- Menu text -->
  <text x="300" y="365" font-family="Playfair Display,serif" font-size="20" fill="#c9a96e" text-anchor="middle" opacity="0.35" font-style="italic">Ember &amp; Oak</text>
  <!-- Stars -->
  <g opacity="0.15" fill="#c9a96e">
    <text x="260" y="365" font-family="serif" font-size="10">&#9733;</text>
    <text x="330" y="365" font-family="serif" font-size="10">&#9733;</text>
  </g>
  <!-- Decorative corners -->
  <path d="M40 40 L80 40 M40 40 L40 80" stroke="#c9a96e" stroke-width="1" opacity="0.15" fill="none"/>
  <path d="M560 40 L520 40 M560 40 L560 80" stroke="#c9a96e" stroke-width="1" opacity="0.15" fill="none"/>
  <path d="M40 360 L80 360 M40 360 L40 320" stroke="#c9a96e" stroke-width="1" opacity="0.15" fill="none"/>
  <path d="M560 360 L520 360 M560 360 L560 320" stroke="#c9a96e" stroke-width="1" opacity="0.15" fill="none"/>
</svg>
