<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="truck1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0e0ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/><line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="75" y1="0" x2="75" y2="400"/><line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="225" y1="0" x2="225" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="375" y1="0" x2="375" y2="400"/><line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="525" y1="0" x2="525" y2="400"/>
  </g>
  <!-- Route line -->
  <path d="M80 300 Q200 200 350 250 Q450 280 520 180" stroke="#fff" stroke-width="2.5" stroke-dasharray="8 6" fill="none" opacity="0.35"/>
  <!-- Location pins -->
  <g transform="translate(80,280)">
    <circle cx="0" cy="0" r="14" fill="#fff" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#667eea"/>
    <path d="M0 14 L0 24" stroke="#fff" stroke-width="2" opacity="0.5"/>
  </g>
  <g transform="translate(350,235)">
    <circle cx="0" cy="0" r="14" fill="#fff" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#764ba2"/>
    <path d="M0 14 L0 24" stroke="#fff" stroke-width="2" opacity="0.5"/>
  </g>
  <g transform="translate(520,165)">
    <circle cx="0" cy="0" r="16" fill="#fff" opacity="0.95"/>
    <circle cx="0" cy="0" r="7" fill="#667eea"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#fff" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="16;24;16" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Delivery truck -->
  <g transform="translate(240, 150)">
    <rect x="0" y="20" width="100" height="55" rx="6" fill="#fff" opacity="0.95"/>
    <rect x="100" y="35" width="50" height="40" rx="6" fill="#e8e4ff"/>
    <rect x="112" y="42" width="30" height="18" rx="3" fill="#667eea" opacity="0.3"/>
    <circle cx="28" cy="78" r="10" fill="#333"/><circle cx="28" cy="78" r="5" fill="#666"/>
    <circle cx="128" cy="78" r="10" fill="#333"/><circle cx="128" cy="78" r="5" fill="#666"/>
    <rect x="10" y="28" width="25" height="8" rx="2" fill="#667eea" opacity="0.5"/>
    <rect x="42" y="28" width="15" height="8" rx="2" fill="#667eea" opacity="0.3"/>
    <rect x="62" y="28" width="15" height="8" rx="2" fill="#667eea" opacity="0.3"/>
    <!-- Package -->
    <rect x="42" y="40" width="20" height="18" rx="2" fill="#ffd93d" stroke="#e6b800" stroke-width="1"/>
    <line x1="42" y1="49" x2="62" y2="49" stroke="#e6b800" stroke-width="1"/>
    <line x1="52" y1="40" x2="52" y2="58" stroke="#e6b800" stroke-width="1"/>
  </g>
  <!-- Globe icon -->
  <g transform="translate(440, 80)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="15" ry="30" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#fff" stroke-width="1" opacity="0.2"/>
    <line x1="-25" y1="-15" x2="25" y2="-15" stroke="#fff" stroke-width="0.8" opacity="0.15"/>
    <line x1="-25" y1="15" x2="25" y2="15" stroke="#fff" stroke-width="0.8" opacity="0.15"/>
  </g>
  <!-- Tracking UI card -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="400" height="50" rx="10" fill="#fff" opacity="0.12"/>
    <circle cx="30" cy="25" r="8" fill="#4ade80"/>
    <text x="50" y="29" font-family="Inter,sans-serif" font-size="13" fill="#fff" opacity="0.9" font-weight="600">Package in transit - Arriving today</text>
    <rect x="300" y="15" width="80" height="20" rx="10" fill="#fff" opacity="0.15"/>
    <text x="325" y="29" font-family="Inter,sans-serif" font-size="10" fill="#fff" opacity="0.8" font-weight="500">Track &rarr;</text>
  </g>
</svg>
