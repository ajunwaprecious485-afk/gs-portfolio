<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)"/>
  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#6c5ce7" stroke-width="0.5">
    <line x1="0" y1="80" x2="600" y2="80"/><line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/><line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/>
  </g>
  <!-- Code brackets -->
  <g transform="translate(130, 140)">
    <text font-family="monospace" font-size="80" fill="#6c5ce7" opacity="0.15" font-weight="300">&lt;/&gt;</text>
  </g>
  <!-- Browser window -->
  <g transform="translate(170, 80)">
    <rect x="0" y="0" width="260" height="180" rx="10" fill="#1a1a2e" stroke="#2a2a3e" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="30" rx="10" fill="#12121a"/>
    <rect x="0" y="20" width="260" height="10" fill="#12121a"/>
    <circle cx="16" cy="15" r="4" fill="#ff5f57"/><circle cx="30" cy="15" r="4" fill="#febc2e"/><circle cx="44" cy="15" r="4" fill="#28c840"/>
    <rect x="60" y="10" width="140" height="10" rx="5" fill="#2a2a3e"/>
    <!-- Content lines -->
    <rect x="16" y="42" width="80" height="6" rx="3" fill="#6c5ce7" opacity="0.4"/>
    <rect x="16" y="56" width="200" height="4" rx="2" fill="#2a2a3e"/>
    <rect x="16" y="66" width="160" height="4" rx="2" fill="#2a2a3e"/>
    <rect x="16" y="76" width="180" height="4" rx="2" fill="#2a2a3e"/>
    <rect x="16" y="92" width="60" height="24" rx="6" fill="#6c5ce7" opacity="0.6"/>
    <rect x="86" y="92" width="60" height="24" rx="6" fill="#00e4b8" opacity="0.3"/>
    <!-- Image placeholders -->
    <rect x="16" y="128" width="55" height="36" rx="4" fill="#2a2a3e"/>
    <rect x="80" y="128" width="55" height="36" rx="4" fill="#2a2a3e"/>
    <rect x="144" y="128" width="55" height="36" rx="4" fill="#2a2a3e"/>
    <rect x="208" y="128" width="36" height="36" rx="4" fill="#2a2a3e"/>
  </g>
  <!-- Floating particles -->
  <circle cx="100" cy="100" r="3" fill="#6c5ce7" opacity="0.3">
    <animate attributeName="cy" values="100;90;100" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="150" r="2" fill="#00e4b8" opacity="0.3">
    <animate attributeName="cy" values="150;140;150" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="320" r="3" fill="#6c5ce7" opacity="0.2">
    <animate attributeName="cy" values="320;310;320" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="300" r="2" fill="#00e4b8" opacity="0.2">
    <animate attributeName="cy" values="300;290;300" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Cursor -->
  <g transform="translate(350, 200)" opacity="0.5">
    <path d="M0 0 L0 16 L4 12 L8 20 L11 18 L7 10 L12 10 Z" fill="#fff"/>
  </g>
  <!-- Text -->
  <text x="300" y="320" font-family="Inter,sans-serif" font-size="16" fill="#fff" text-anchor="middle" opacity="0.15" font-weight="300">Web Developer</text>
  <text x="300" y="350" font-family="Inter,sans-serif" font-size="22" fill="#6c5ce7" text-anchor="middle" opacity="0.12" font-weight="700">Gs_Dev</text>
</svg>
