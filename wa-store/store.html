<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store — WaStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #25D366;
            --text: #111827;
            --muted: #6b7280;
            --bg: #f5f6fa;
            --white: #ffffff;
            --border: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .store-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .store-header {
            text-align: center;
            padding: 40px 16px 24px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
        }

        .store-logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 auto 14px;
        }

        .store-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .store-header p {
            color: var(--muted);
            font-size: 0.92rem;
        }

        .store-search {
            padding: 16px;
        }

        .store-search input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            background: var(--white);
            transition: border-color 0.2s;
        }

        .store-search input:focus {
            border-color: var(--primary);
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar { display: none; }

        .cat-tab {
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 0.82rem;
            font-weight: 700;
            background: var(--white);
            border: 1.5px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-tab.active, .cat-tab:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 16px;
        }

        .product-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .product-card:hover { transform: translateY(-2px); }

        .product-img {
            width: 100%;
            height: 140px;
            background: #e5e7eb;
            object-fit: cover;
        }

        .product-info {
            padding: 14px;
        }

        .product-info h3 {
            font-size: 0.92rem;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .product-price {
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .product-desc {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .order-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 700;
            background: var(--primary);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .order-btn:hover { background: #128C7E; }

        .empty-store {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }

        .empty-store h2 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        .store-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-top: 1px solid var(--border);
            padding: 14px 16px;
            text-align: center;
        }

        .wa-footer-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background 0.2s;
        }

        .wa-footer-btn:hover { background: #128C7E; }

        .powered-by {
            font-size: 0.72rem;
            color: #d1d5db;
            margin-top: 8px;
        }

        .powered-by a { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>
    <div class="store-container">
        <div class="store-header">
            <div class="store-logo" id="storeLogo">ST</div>
            <h1 id="storeName">Loading...</h1>
            <p id="storeDesc"></p>
        </div>

        <div class="store-search">
            <input type="text" id="searchInput" placeholder="Search products...">
        </div>

        <div class="category-tabs" id="categoryTabs"></div>

        <div class="products-grid" id="productsGrid"></div>

        <div class="empty-store" id="emptyStore" style="display:none;">
            <h2>Store not found</h2>
            <p>This store doesn't exist or has been removed.</p>
        </div>
    </div>

    <div class="store-footer" id="storeFooter" style="display:none;">
        <a href="#" class="wa-footer-btn" id="waOrderBtn">
            <svg viewBox="0 0 24 24" fill="#fff" width="20" height="20"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.5.5 0 00.613.613l4.458-1.495A11.952 11.952 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-2.37 0-4.567-.82-6.293-2.192l-.44-.357-2.893.97.97-2.893-.357-.44A9.965 9.965 0 012 12C2 6.486 6.486 2 12 2s10 4.486 10 10-4.486 10-10 10z"/></svg>
            Order on WhatsApp
        </a>
        <p class="powered-by">Powered by <a href="index.html">WaStore</a></p>
    </div>

    <script>
        const store = JSON.parse(localStorage.getItem('wastore') || '{}');
        const products = JSON.parse(localStorage.getItem('waproducts') || '[]');
        const analytics = JSON.parse(localStorage.getItem('waanalytics') || '{"views":0,"clicks":0}');

        if (!store.name) {
            document.getElementById('emptyStore').style.display = 'block';
            document.getElementById('storeFooter').style.display = 'none';
        } else {
            document.title = `${store.name} — WaStore`;

            const initials = store.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
            document.getElementById('storeLogo').textContent = initials;
            document.getElementById('storeLogo').style.background = store.color || '#25D366';
            document.getElementById('storeName').textContent = store.name;
            document.getElementById('storeDesc').textContent = store.description || '';

            if (store.phone) {
                document.getElementById('storeFooter').style.display = 'block';
                document.getElementById('waOrderBtn').href = `https://wa.me/${store.phone}?text=${encodeURIComponent('Hi! I\'m interested in your products.')}`;
                document.getElementById('waOrderBtn').addEventListener('click', () => {
                    analytics.clicks++;
                    localStorage.setItem('waanalytics', JSON.stringify(analytics));
                });
            }

            renderProducts(products);
            renderCategories();
        }

        function renderCategories() {
            const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
            const tabs = document.getElementById('categoryTabs');
            if (cats.length === 0) return;

            tabs.innerHTML = `<button class="cat-tab active" data-cat="all">All</button>` +
                cats.map(c => `<button class="cat-tab" data-cat="${c}">${c}</button>`).join('');

            tabs.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const cat = tab.dataset.cat;
                    const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
                    renderProducts(filtered);
                });
            });
        }

        function renderProducts(list) {
            const grid = document.getElementById('productsGrid');
            if (list.length === 0) {
                grid.innerHTML = '<div class="empty-store" style="grid-column:1/-1;padding:40px 20px;"><h2>No products yet</h2></div>';
                return;
            }

            grid.innerHTML = list.map(p => `
                <div class="product-card">
                    <div class="product-img" style="background:url('${p.image || ''}') center/cover, #e5e7eb;"></div>
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p class="product-price">₦${Number(p.price).toLocaleString()}</p>
                        ${p.desc ? `<p class="product-desc">${p.desc}</p>` : ''}
                        <button class="order-btn" onclick="orderProduct('${p.name}', ${p.price})">
                            <svg viewBox="0 0 24 24" fill="#fff" width="14" height="14"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.5.5 0 00.613.613l4.458-1.495A11.952 11.952 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
                            Order
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function orderProduct(name, price) {
            const phone = store.phone;
            const msg = `Hi! I'd like to order:\n\n*${name}*\nPrice: ₦${Number(price).toLocaleString()}\n\nPlease confirm availability.`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = products.filter(p =>
                p.name.toLowerCase().includes(q) ||
                (p.desc && p.desc.toLowerCase().includes(q)) ||
                (p.category && p.category.toLowerCase().includes(q))
            );
            renderProducts(filtered);
        });
    </script>
</body>
</html>
